[project]
name = "serie"
version = "0.1.1"
description = "Time-series evaluation data layer for clean sources, interventions, and noise titration."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Qilin Wang" },
]
keywords = ["time-series", "forecasting", "benchmarking", "dynamical-systems", "robustness", "titration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pillow>=10.0",
    "msgspec>=0.21.0",
    "cappa>=0.31.0",
    "matplotlib>=3.8",
    "numpy>=2.0",
    "polars>=1.0",
    "safetensors>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/QilinWang/serie"
Repository = "https://github.com/QilinWang/serie"

[project.scripts]
serie = "serie.cli:main"

[project.optional-dependencies]
split = [
    "scikit-learn>=1.6",
]
diagnostics = [
    "rich>=13.0",
]
all = [
    "rich>=13.0",
]
dev = [
    "hypothesis>=6.0",
    "pre-commit>=4.0",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "rich>=13.0",
    "ruff>=0.8",
    "scikit-learn>=1.6",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "serie" = "." }
packages = ["serie"]
include-package-data = false

[tool.setuptools.package-data]
serie = [
    "demo_dist/**",
]

[tool.setuptools.exclude-package-data]
serie = [
    "assets/**",
    "demo/**",
    "demo_dist/attractor_data.json",
    ".claude/**",
    ".pytest_cache/**",
    "__pycache__/**",
    "*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_torch: needs PyTorch autodiff",
    "requires_simulator: needs Gymnasium or MuJoCo physics dependencies",
    "requires_oracle_bank: needs committed oracle artifacts and their source history",
    "requires_julia: needs the instantiated Julia SciML project",
]

[tool.coverage.run]
source = ["."]
omit = [
    ".github/*",
    ".venv/*",
    "build/*",
    "demo/*",
    "demo_dist/*",
    "dist/*",
    "retired/*",
    "tests/*",
    "tmp/*",
]

[tool.coverage.report]
fail_under = 70
skip_empty = true
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["retired"]

[tool.pyright]
exclude = ["retired"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = [
    # Existing scientific expressions and tables use long lines. Let the
    # formatter handle what it can without making line length a release gate.
    "E501",
    # SERIE intentionally has bilingual EN/CN docstrings and comments.
    "RUF002",
    "RUF003",
    # Public export order is curated by conceptual grouping.
    "RUF022",
    # Lazy public exports keep quoted forward refs for readability.
    "UP037",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
